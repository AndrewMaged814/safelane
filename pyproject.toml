[project]
name = "safelane"
version = "0.1.0"
description = "Evidence-bound release assessment for the SafeLane demo"
requires-python = ">=3.12"
dependencies = [
  "jsonschema>=4.25,<5",
  "PyYAML>=6.0.2,<7",
]

[project.scripts]
safelane = "safelane.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.4,<9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/safelane"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
