<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>SafeLane Studio — Release dossier</title>
    <link rel="stylesheet" href="/styles.css">
    <script src="/app.js" defer></script>
  </head>
  <body>
    <div class="top-rule" aria-hidden="true"></div>
    <header class="masthead">
      <a class="wordmark" href="/" aria-label="SafeLane Studio home">
        <span class="lane-mark" aria-hidden="true"><i></i><i></i><i></i></span>
        <span>SafeLane</span>
      </a>
      <div class="masthead-copy">
        <p class="eyebrow">Local release review / current assessment</p>
        <h1>Decision dossier</h1>
      </div>
      <div class="local-stamp"><span></span> Local workspace</div>
    </header>

    <main id="studio" class="studio" aria-live="polite">
      <section class="loading-card">
        <p class="eyebrow">Reading signed evidence</p>
        <p class="loading-line">Opening the current assessment…</p>
      </section>
    </main>

    <footer>
      <span>SafeLane Studio</span>
      <span>Approval records a rollout plan. It does not release software.</span>
    </footer>
  </body>
</html>
