version: 1

# Phase-one Release Policy. Evidence decides eligibility only; it does not
# produce a risk tier or choose these stages. Risk-based envelopes are a
# later extension, not part of #50.

mandatory_evidence:
  - merged_commit_on_main
  - passing_publish_workflow
  - immutable_ghcr_digest

# Optional. Phase one leaves this off so GitHub and GHCR evidence can be
# tested without an independent reviewer. Turn it on in a later phase.
independent_pr_approval:
  required: false

rollout:
  stages: [5, 25, 50, 100]
  next_action: start
