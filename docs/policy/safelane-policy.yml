version: 2

# The operator declares every lane. An assessment selects among these by
# name; no assessor may emit weights, and no caller may name a lane.
# See docs/adr/0003-risk-selects-the-lane.md.

mandatory_evidence:
  - merged_commit_on_default_branch
  - passing_publish_workflow
  - immutable_ghcr_digest

# Optional. Phase one leaves this off so GitHub and GHCR evidence can be
# tested without an independent reviewer. Turn it on in a later phase.
independent_pr_approval:
  required: false

lanes:
  fast:
    weights: [5, 100]
  standard:
    weights: [5, 25, 50, 100]
  guarded:
    weights: [1, 5, 25, 50, 100]

risk_to_lane:
  low: fast
  medium: standard
  high: guarded

# Used when the heuristic and model both fail, and as the ceiling for any
# situation this file does not describe. Always the narrowest lane
# configured -- never the widest, and this never blocks a release.
default_lane: guarded

assessment:
  # Always runs. Sets the floor. Not optional.
  heuristic:
    agent_authored_minimum: medium
    paths:
      - { glob: "pkg/api/**",       minimum: medium }
      - { glob: "**/migrations/**", minimum: high }
      - { glob: "charts/**",        minimum: high }
    size:
      - { changed_lines_at_least: 200, minimum: medium }
      - { files_at_least: 15,          minimum: medium }

  # Best-effort. May only raise the risk. Tried in order; first available wins.
  model:
    assessors: [claude, codex]
    timeout: 90s
    max_diff_bytes: 200000
