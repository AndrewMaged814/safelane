# Constant traffic through the ingress controller, so nginx actually splits it
# between the stable and canary Services and the AnalysisTemplate has both a
# numerator and a denominator.
#
# It must hit ingress-nginx-controller directly with an explicit Host header:
# the Ingress host `podinfo.production.svc.cluster.local` is not resolvable
# in-cluster DNS (PLAN.md V3). Hitting the podinfo Service directly would
# bypass nginx entirely and the canary would receive no traffic at all.
#
# If this dies, every measurement returns an empty result. That is a FAILURE,
# not a pass -- successCondition is `len(result) > 0 && ...` on purpose.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loadgen
  namespace: podinfo
  labels:
    app.kubernetes.io/name: loadgen
    app.kubernetes.io/part-of: safelane
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: loadgen
  template:
    metadata:
      labels:
        app.kubernetes.io/name: loadgen
        app.kubernetes.io/part-of: safelane
    spec:
      containers:
        - name: loadgen
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              while true; do
                wget -q -O /dev/null -T 2 \
                  --header="Host: podinfo.production.svc.cluster.local" \
                  http://ingress-nginx-controller.ingress-nginx.svc.cluster.local/ \
                  2>/dev/null || true
              done
          resources:
            requests:
              cpu: 50m
              memory: 16Mi
            limits:
              cpu: 300m
              memory: 64Mi
