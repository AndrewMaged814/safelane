<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 190" role="img" aria-labelledby="title desc">
  <title id="title">SafeLane</title>
  <desc id="desc">Two deployment lanes branch toward separate rollout paths beside the SafeLane wordmark.</desc>
  <defs>
    <linearGradient id="safe" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#13C55B"/>
      <stop offset="1" stop-color="#08AD4C"/>
    </linearGradient>
    <linearGradient id="guarded" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A5A9B0"/>
      <stop offset="1" stop-color="#7F858E"/>
    </linearGradient>
    <linearGradient id="graphite" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4A525B"/>
      <stop offset="1" stop-color="#30363D"/>
    </linearGradient>
  </defs>

  <g aria-hidden="true">
    <g fill="url(#safe)">
      <circle cx="20" cy="79" r="8"/>
      <circle cx="54" cy="79" r="8"/>
      <circle cx="88" cy="79" r="8"/>
    </g>
    <path d="M121 79H177C191 79 200 74 210 64L246 28C254 20 263 16 276 16H393"
      fill="none" stroke="url(#safe)" stroke-width="17" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M386 1L421 28 386 55Z" fill="url(#safe)" stroke="#08AD4C" stroke-width="5" stroke-linejoin="round"/>

    <g fill="url(#guarded)">
      <circle cx="20" cy="113" r="8"/>
      <circle cx="54" cy="113" r="8"/>
      <circle cx="88" cy="113" r="8"/>
    </g>
    <path d="M121 113H177C191 113 200 118 210 128L246 164C254 172 263 176 276 176H393"
      fill="none" stroke="url(#guarded)" stroke-width="17" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M386 149L421 176 386 189Z" fill="url(#guarded)" stroke="#7F858E" stroke-width="5" stroke-linejoin="round"/>

    <path d="M230 96H390" fill="none" stroke="#969CA4" stroke-width="11" stroke-linecap="round"/>
  </g>

  <text x="470" y="133" font-family="Segoe UI, Arial, sans-serif" font-size="112" font-weight="600" letter-spacing="-5">
    <tspan fill="url(#safe)">Safe</tspan><tspan fill="url(#graphite)">Lane</tspan>
  </text>
</svg>
