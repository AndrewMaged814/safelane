apiVersion: v1
kind: ConfigMap
metadata:
  name: safelane-dashboard
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: safelane
data:
  safelane.json: "{\n  \"uid\": \"safelane-rollout\",\n  \"title\": \"SafeLane \\u2014 canary health\",\n  \"tags\": [\n    \"safelane\"\n  ],\n  \"timezone\": \"browser\",\n  \"schemaVersion\": 39,\n  \"version\": 1,\n  \"refresh\": \"5s\",\n  \"time\": {\n    \"from\": \"now-15m\",\n    \"to\": \"now\"\n  },\n  \"panels\": [\n    {\n      \"id\": 1,\n      \"type\": \"timeseries\",\n      \"title\": \"Success rate \\u2014 canary vs stable\",\n      \"description\": \"Exactly the query the AnalysisTemplate decides from. The red line is the 0.99 service health limit; two readings below it and Argo aborts. An empty result is a failed reading, never a pass.\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"safelane-prom\"\n      },\n      \"gridPos\": {\n        \"h\": 9,\n        \"w\": 16,\n        \"x\": 0,\n        \"y\": 0\n      },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"percentunit\",\n          \"min\": 0,\n          \"custom\": {\n            \"lineWidth\": 2,\n            \"fillOpacity\": 8,\n            \"showPoints\": \"never\",\n            \"spanNulls\": true,\n            \"thresholdsStyle\": {\n              \"mode\": \"line\"\n            }\n          },\n          \"thresholds\": {\n            \"mode\": \"absolute\",\n            \"steps\": [\n              {\n                \"color\": \"red\",\n                \"value\": null\n              },\n              {\n                \"color\": \"green\",\n                \"value\": 0.99\n              }\n            ]\n          }\n        },\n        \"overrides\": [\n          {\n            \"matcher\": {\n              \"id\": \"byName\",\n              \"options\": \"canary\"\n            },\n            \"properties\": [\n              {\n                \"id\": \"color\",\n                \"value\": {\n                  \"mode\": \"fixed\",\n                  \"fixedColor\": \"red\"\n                }\n              }\n            ]\n          },\n          {\n            \"matcher\": {\n              \"id\": \"byName\",\n              \"options\": \"stable\"\n            },\n            \"properties\": [\n              {\n                \"id\": \"color\",\n                \"value\": {\n                  \"mode\": \"fixed\",\n                  \"fixedColor\": \"green\"\n                }\n              }\n            ]\n          }\n        ]\n      },\n      \"options\": {\n        \"legend\": {\n          \"displayMode\": \"list\",\n          \"placement\": \"bottom\",\n          \"showLegend\": true\n        },\n        \"tooltip\": {\n          \"mode\": \"multi\",\n          \"sort\": \"desc\"\n        }\n      },\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n          \"editorMode\": \"code\",\n          \"expr\": \"sum(rate(http_requests_total{namespace=\\\"podinfo\\\",service=\\\"podinfo-canary\\\",status!~\\\"5..\\\"}[1m])) / sum(rate(http_requests_total{namespace=\\\"podinfo\\\",service=\\\"podinfo-canary\\\"}[1m]))\",\n          \"legendFormat\": \"canary\"\n        },\n        {\n          \"refId\": \"B\",\n          \"editorMode\": \"code\",\n          \"expr\": \"sum(rate(http_requests_total{namespace=\\\"podinfo\\\",service=\\\"podinfo-stable\\\",status!~\\\"5..\\\"}[1m])) / sum(rate(http_requests_total{namespace=\\\"podinfo\\\",service=\\\"podinfo-stable\\\"}[1m]))\",\n          \"legendFormat\": \"stable\"\n        }\n      ]\n    },\n    {\n      \"id\": 2,\n      \"type\": \"stat\",\n      \"title\": \"Requests served the canary version\",\n      \"description\": \"Blast radius before the brake fires. A flat pipeline would have served this to everyone.\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"safelane-prom\"\n      },\n      \"gridPos\": {\n        \"h\": 5,\n        \"w\": 8,\n        \"x\": 16,\n        \"y\": 0\n      },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"short\",\n          \"decimals\": 0,\n          \"thresholds\": {\n            \"mode\": \"absolute\",\n            \"steps\": [\n              {\n                \"color\": \"blue\",\n                \"value\": null\n              }\n            ]\n          }\n        },\n        \"overrides\": []\n      },\n      \"options\": {\n        \"reduceOptions\": {\n          \"calcs\": [\n            \"lastNotNull\"\n          ],\n          \"fields\": \"\",\n          \"values\": false\n        },\n        \"colorMode\": \"value\",\n        \"graphMode\": \"area\",\n        \"textMode\": \"auto\"\n      },\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n          \"editorMode\": \"code\",\n          \"expr\": \"sum(increase(http_requests_total{namespace=\\\"podinfo\\\",service=\\\"podinfo-canary\\\"}[15m]))\"\n        }\n      ]\n    },\n    {\n      \"id\": 3,\n      \"type\": \"stat\",\n      \"title\": \"\\u2026of which 5xx\",\n      \"description\": \"The users actually hurt.\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"safelane-prom\"\n      },\n      \"gridPos\": {\n        \"h\": 4,\n        \"w\": 8,\n        \"x\": 16,\n        \"y\": 5\n      },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"short\",\n          \"decimals\": 0,\n          \"thresholds\": {\n            \"mode\": \"absolute\",\n            \"steps\": [\n              {\n                \"color\": \"red\",\n                \"value\": null\n              }\n            ]\n          }\n        },\n        \"overrides\": []\n      },\n      \"options\": {\n        \"reduceOptions\": {\n          \"calcs\": [\n            \"lastNotNull\"\n          ],\n          \"fields\": \"\",\n          \"values\": false\n        },\n        \"colorMode\": \"value\",\n        \"graphMode\": \"area\",\n        \"textMode\": \"auto\"\n      },\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n          \"editorMode\": \"code\",\n          \"expr\": \"sum(increase(http_requests_total{namespace=\\\"podinfo\\\",service=\\\"podinfo-canary\\\",status=~\\\"5..\\\"}[15m]))\"\n        }\n      ]\n    },\n    {\n      \"id\": 4,\n      \"type\": \"timeseries\",\n      \"title\": \"Exposure \\u2014 pods by role\",\n      \"description\": \"nginx traffic routing means the weight is a real traffic split, not a pod count. This shows how many pods each Service currently selects. Counted through rate() so series left behind by a Service-selector change drop out.\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"safelane-prom\"\n      },\n      \"gridPos\": {\n        \"h\": 8,\n        \"w\": 12,\n        \"x\": 0,\n        \"y\": 9\n      },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"short\",\n          \"min\": 0,\n          \"custom\": {\n            \"lineWidth\": 2,\n            \"fillOpacity\": 20,\n            \"showPoints\": \"never\",\n            \"spanNulls\": true,\n            \"lineInterpolation\": \"stepAfter\"\n          }\n        },\n        \"overrides\": [\n          {\n            \"matcher\": {\n              \"id\": \"byName\",\n              \"options\": \"canary\"\n            },\n            \"properties\": [\n              {\n                \"id\": \"color\",\n                \"value\": {\n                  \"mode\": \"fixed\",\n                  \"fixedColor\": \"red\"\n                }\n              }\n            ]\n          },\n          {\n            \"matcher\": {\n              \"id\": \"byName\",\n              \"options\": \"stable\"\n            },\n            \"properties\": [\n              {\n                \"id\": \"color\",\n                \"value\": {\n                  \"mode\": \"fixed\",\n                  \"fixedColor\": \"green\"\n                }\n              }\n            ]\n          }\n        ]\n      },\n      \"options\": {\n        \"legend\": {\n          \"displayMode\": \"list\",\n          \"placement\": \"bottom\",\n          \"showLegend\": true\n        },\n        \"tooltip\": {\n          \"mode\": \"multi\",\n          \"sort\": \"desc\"\n        }\n      },\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n          \"editorMode\": \"code\",\n          \"expr\": \"count(count by (pod) (rate(http_requests_total{namespace=\\\"podinfo\\\",service=\\\"podinfo-canary\\\"}[1m]))) or vector(0)\",\n          \"legendFormat\": \"canary\"\n        },\n        {\n          \"refId\": \"B\",\n          \"editorMode\": \"code\",\n          \"expr\": \"count(count by (pod) (rate(http_requests_total{namespace=\\\"podinfo\\\",service=\\\"podinfo-stable\\\"}[1m]))) or vector(0)\",\n          \"legendFormat\": \"stable\"\n        }\n      ]\n    },\n    {\n      \"id\": 5,\n      \"type\": \"timeseries\",\n      \"title\": \"Request rate by role\",\n      \"description\": \"The denominator of the analysis query. If this goes flat the analysis has no data, and no data is treated as a failure.\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"safelane-prom\"\n      },\n      \"gridPos\": {\n        \"h\": 8,\n        \"w\": 12,\n        \"x\": 12,\n        \"y\": 9\n      },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"reqps\",\n          \"min\": 0,\n          \"custom\": {\n            \"lineWidth\": 2,\n            \"fillOpacity\": 8,\n            \"showPoints\": \"never\",\n            \"spanNulls\": true\n          }\n        },\n        \"overrides\": [\n          {\n            \"matcher\": {\n              \"id\": \"byName\",\n              \"options\": \"canary\"\n            },\n            \"properties\": [\n              {\n                \"id\": \"color\",\n                \"value\": {\n                  \"mode\": \"fixed\",\n                  \"fixedColor\": \"red\"\n                }\n              }\n            ]\n          },\n          {\n            \"matcher\": {\n              \"id\": \"byName\",\n              \"options\": \"stable\"\n            },\n            \"properties\": [\n              {\n                \"id\": \"color\",\n                \"value\": {\n                  \"mode\": \"fixed\",\n                  \"fixedColor\": \"green\"\n                }\n              }\n            ]\n          }\n        ]\n      },\n      \"options\": {\n        \"legend\": {\n          \"displayMode\": \"list\",\n          \"placement\": \"bottom\",\n          \"showLegend\": true\n        },\n        \"tooltip\": {\n          \"mode\": \"multi\",\n          \"sort\": \"desc\"\n        }\n      },\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n          \"editorMode\": \"code\",\n          \"expr\": \"sum(rate(http_requests_total{namespace=\\\"podinfo\\\",service=\\\"podinfo-canary\\\"}[1m]))\",\n          \"legendFormat\": \"canary\"\n        },\n        {\n          \"refId\": \"B\",\n          \"editorMode\": \"code\",\n          \"expr\": \"sum(rate(http_requests_total{namespace=\\\"podinfo\\\",service=\\\"podinfo-stable\\\"}[1m]))\",\n          \"legendFormat\": \"stable\"\n        }\n      ]\n    },\n    {\n      \"id\": 6,\n      \"type\": \"table\",\n      \"title\": \"AnalysisRuns \\u2014 what the controller decided\",\n      \"description\": \"Straight from the Argo Rollouts controller's own metrics, not from SafeLane.\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"safelane-prom\"\n      },\n      \"gridPos\": {\n        \"h\": 7,\n        \"w\": 16,\n        \"x\": 0,\n        \"y\": 17\n      },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"custom\": {\n            \"align\": \"auto\"\n          }\n        },\n        \"overrides\": []\n      },\n      \"options\": {\n        \"showHeader\": true\n      },\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n          \"editorMode\": \"code\",\n          \"expr\": \"analysis_run_info{namespace=\\\"podinfo\\\"}\",\n          \"format\": \"table\",\n          \"instant\": true\n        }\n      ],\n      \"transformations\": [\n        {\n          \"id\": \"organize\",\n          \"options\": {\n            \"excludeByName\": {\n              \"Time\": true,\n              \"Value\": true,\n              \"__name__\": true,\n              \"job\": true,\n              \"instance\": true,\n              \"service\": true,\n              \"namespace\": true,\n              \"endpoint\": true,\n              \"container\": true,\n              \"pod\": true\n            },\n            \"renameByName\": {\n              \"name\": \"AnalysisRun\",\n              \"phase\": \"Phase\"\n            }\n          }\n        }\n      ]\n    },\n    {\n      \"id\": 7,\n      \"type\": \"stat\",\n      \"title\": \"Automatic rollbacks\",\n      \"description\": \"rollout_events_total{reason=\\\"RolloutAborted\\\"} \\u2014 the controller aborting on its own.\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"safelane-prom\"\n      },\n      \"gridPos\": {\n        \"h\": 7,\n        \"w\": 8,\n        \"x\": 16,\n        \"y\": 17\n      },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"short\",\n          \"decimals\": 0,\n          \"thresholds\": {\n            \"mode\": \"absolute\",\n            \"steps\": [\n              {\n                \"color\": \"orange\",\n                \"value\": null\n              }\n            ]\n          }\n        },\n        \"overrides\": []\n      },\n      \"options\": {\n        \"reduceOptions\": {\n          \"calcs\": [\n            \"lastNotNull\"\n          ],\n          \"fields\": \"\",\n          \"values\": false\n        },\n        \"colorMode\": \"value\",\n        \"graphMode\": \"area\",\n        \"textMode\": \"auto\"\n      },\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n          \"editorMode\": \"code\",\n          \"expr\": \"sum(increase(rollout_events_total{namespace=\\\"podinfo\\\",reason=\\\"RolloutAborted\\\"}[15m]))\"\n        }\n      ]\n    }\n  ]\n}\n"
