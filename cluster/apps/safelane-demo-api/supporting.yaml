apiVersion: v1
kind: Service
metadata:
  name: safelane-demo-api-stable
  namespace: safelane-demo-api
spec:
  selector:
    app.kubernetes.io/name: safelane-demo-api
  ports:
  - name: http
    port: 80
    targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: safelane-demo-api-canary
  namespace: safelane-demo-api
spec:
  selector:
    app.kubernetes.io/name: safelane-demo-api
  ports:
  - name: http
    port: 80
    targetPort: http
