apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: safelane-demo-api
  namespace: safelane-demo-api
  labels:
    safelane.dev/owned-demo: 'true'
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: safelane-demo-api
  strategy:
    canary:
      stableService: safelane-demo-api-stable
      canaryService: safelane-demo-api-canary
  template:
    metadata:
      labels:
        app.kubernetes.io/name: safelane-demo-api
    spec:
      containers:
      - name: api
        image: ghcr.io/andrewmaged814/safelane-demo-api@${BASELINE_DIGEST}
        env:
        - name: GIT_SHA
          value: 726662d2c396b54cfc047721a41bc67e77643924
        ports:
        - name: http
          containerPort: 8080
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
