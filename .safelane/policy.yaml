schema_version: "1"
policy_version: "safelane-2026.08.1"
release_service:
  name: safelane
  replicas: 5
  critical: false
  downstream_dependents: []
  path_prefixes: [src/safelane/]
scope:
  small_max_files: 2
  small_max_lines: 50
  large_min_files: 10
  large_min_lines: 500
ai:
  provider: ollama
  model: qwen2.5-coder:7b
  max_diff_bytes: 16384
  timeout_seconds: 60
  attempts: 1
  temperature: 0
  seed: 42
  num_ctx: 8192
  num_predict: 768
rollout:
  traffic_router: none
  max_surge: 1
  max_unavailable: 0
profiles:
  Fast:
    stages:
      - {set_weight: 100, exposure_pods: 5, analysis: false}
  Guarded:
    stages:
      - {set_weight: 40, exposure_pods: 2, analysis: true}
      - {set_weight: 100, exposure_pods: 5, analysis: false}
  Strict:
    stages:
      - {set_weight: 20, exposure_pods: 1, analysis: true}
      - {set_weight: 40, exposure_pods: 2, analysis: true}
      - {set_weight: 60, exposure_pods: 3, analysis: true}
      - {set_weight: 100, exposure_pods: 5, analysis: false}
