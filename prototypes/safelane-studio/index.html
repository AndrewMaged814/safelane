  <style>

play:grid;justify-items:end;gap:5px}.suggestion span{color:var(--faint);font:600 8px/1 var(--mono);letter-spacing:.09em;text-transform:uppercase}.suggestion strong{display:flex;align-items:center;gap:6px;color:var(--ink);font-size:12px}.suggestion strong:before{width:7px;height:7px;border-radius:50%;background:var(--lane-color);content:""}.suggestion.strict{--lane-color:var(--red)}.suggestion.guarded{--lane-color:#d9891b}.suggestion.fast{--lane-color:var(--green)}.tag,.lane{display:inline-flex;align-items:center;gap:5px;padding:5px 8px;border-radius:999px;font-size:9px;font-weight:800;text-transform:uppercase;white-space:nowrap}.tag.risky{background:var(--redSoft);color:var(--red)}.tag.guarded{background:var(--amberSoft);color:var(--amber)}.tag.safe{background:var(--greenSoft);color:var(--green)}.lane{border:1px solid currentColor;background:#fff}.lane.strict{color:var(--red)}.lane.guarded{color:var(--amber)}.lane.fast{color:var(--green)}.arrow{color:#9ca4b1;font-size:18px}

    .rollout{padding:20px}.rail-wrap{display:flex;width:100%;align-items:center;margin-top:20px;color:var(--amber)}.pod{display:grid;min-width:52px;place-items:center}.pod-circle{display:grid;width:42px;height:42px;place-items:center;border:2px solid currentColor;border-radius:50%;background:#fffaf2;color:currentColor;font-size:12px;font-weight:800}.pod:last-child .pod-circle{border-color:var(--dark);background:var(--dark);color:#fff}.pod small{margin-top:7px;color:#8a93a3;font:500 9px/1 ui-monospace,monospace}.rail{position:relative;flex:1;height:2px;background:#eadfce}.rail:after{position:absolute;top:50%;left:50%;width:6px;height:6px;transform:translate(-50%,-50%) rotate(45deg);background:#d4ad7a;content:""}.health{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:18px}.health div{padding:10px;border-radius:9px;background:#f8f9fb}.health span{display:block;color:#8b94a4;font:600 8px/1 ui-monospace,monospace;text-transform:uppercase}.health strong{display:block;margin-top:6px;color:var(--ink);font-size:12px}.evidence{overflow:hidden}.evidence summary{display:flex;justify-content:space-between;padding:17px 19px;color:var(--ink);cursor:pointer;font-size:13px;font-weight:800;list-style:none}.evidence summary:after{color:var(--brand2);content:"+";font-size:18px}.evidence[open] summary:after{content:"−"}.evidence-list{display:grid;gap:9px;padding:0 19px 19px}.evidence-item{padding:12px;border:1px solid #d8e9e1;border-radius:9px;background:#f5fbf8}.evidence-item strong{display:block;color:#176b4b;font-size:11px}.evidence-item code,.evidence-item p{display:block;margin:5px 0 0;color:#536172;font:500 10px/1.5 ui-monospace,monospace}.approval{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:18px}.approval h2{margin:0;color:var(--ink);font-size:15px}.approval p{margin:5px 0 0;color:var(--muted);font-size:11px}.buttons{display:flex;align-items:center;justify-content:flex-end;gap:8px;flex-wrap:wrap}.button{display:inline-flex;padding:10px 13px;border:1px solid #d5dae2;border-radius:9px;background:#fff;color:#404858;font-size:11px;font-weight:800;text-decoration:none}.button.primary{border-color:var(--brand);background:var(--brand);color:#fff}.button.purple{border-color:var(--purple);background:var(--purple);color:#fff}.button.link{padding-inline:5px;border-color:transparent;background:transparent;color:var(--brand2)}.approved{color:var(--green);font-size:12px;font-weight:800}
    .profiles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.profile-card{position:relative;min-height:174px;overflow:hidden;padding:17px;border:1px solid var(--border);border-radius:var(--radius);background:#fff;box-shadow:var(--shadow)}.profile-card:before{position:absolute;top:0;right:0;left:0;height:4px;background:var(--profile);content:""}.profile-icon{display:grid;width:31px;height:31px;place-items:center;border-radius:9px;background:var(--soft);color:var(--profile);font-weight:900}.profile-card h2{margin:14px 0 4px;color:var(--ink);font-size:15px}.profile-card p{min-height:38px;margin:0;color:var(--muted);font-size:11px;line-height:1.5}.profile-card code{display:block;margin-top:13px;color:#536172;font:600 10px/1.4 ui-monospace,monospace}.custom-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:28px 0 11px}.custom-head h2{margin:0;color:var(--ink);font-size:15px}.profile-actions{display:flex;align-items:center;gap:7px}.custom-list{overflow:hidden;border:1px solid var(--border);border-radius:var(--radius);background:#fff;box-shadow:var(--shadow)}.custom-row{display:grid;grid-template-columns:1fr 1fr auto;gap:16px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--border)}.custom-row:last-child{border-bottom:0}.custom-name{color:var(--ink);font-size:12px;font-weight:800}.custom-meta{margin-top:4px;color:var(--muted);font:500 10px/1.4 ui-monospace,monospace}.custom-source{color:var(--purple);font-size:10px;font-weight:700}
    .create{padding:20px}.prompt{padding:15px;border:1px solid #dcd2f3;border-radius:11px;background:#f8f5ff}.prompt label{display:block;margin-bottom:8px;color:#343044;font-size:12px;font-weight:800}.prompt textarea{width:100%;min-height:96px;padding:11px;border:1px solid #ddd8e8;border-radius:9px;outline:0;background:#fff;color:var(--text);resize:vertical}.prompt-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:9px}.prompt-foot small{max-width:480px;color:#777086;font-size:10px;line-height:1.45}.empty{padding:42px 20px;color:var(--muted);text-align:center}.empty strong{display:block;margin-bottom:5px;color:var(--ink)}hr{margin:20px 0;border:0;border-top:1px solid var(--border)}.draft-head{display:flex;justify-content:space-between;margin-bottom:13px}.draft-head h2{margin:0;color:var(--ink);font-size:15px}.valid{color:var(--green);font-size:10px;font-weight:800}.form{display:grid;grid-template-columns:1fr 1fr;gap:11px}.field{display:grid;gap:6px}.field.wide{grid-column:1/-1}.field label{color:#727b8c;font:700 9px/1.2 ui-monospace,monospace;letter-spacing:.07em;text-transform:uppercase}.field input,.field select{width:100%;padding:10px 11px;border:1px solid #d5dae2;border-radius:9px;outline:0;background:#fff;color:var(--text)}.yaml{margin-top:14px}.yaml summary{color:var(--brand2);cursor:pointer;font-size:11px;font-weight:800}.yaml pre{margin:9px 0 0;padding:12px;overflow:auto;border-radius:9px;background:var(--dark);color:#dce3ec;font:500 10px/1.55 ui-monospace,monospace}.create-actions{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-top:17px;padding-top:15px;border-top:1px solid var(--border)}.create-actions small{color:var(--muted);font-size:10px}.toast{position:fixed;right:20px;bottom:20px;z-index:90;max-width:min(390px,calc(100vw - 40px));padding:13px 15px;border-left:4px solid var(--brand);border-radius:10px;background:var(--dark);color:#fff;box-shadow:0 18px 45px rgba(16,24,40,.22);font-size:12px}.toast.error{border-left-color:var(--red)}
    @media(max-width:900px){.shell{grid-template-columns:1fr}.sidebar{min-height:auto;padding:12px 16px;border-right:0;border-bottom:1px solid var(--border)}.brand{padding-bottom:12px}.nav-label,.repo-card{display:none}.main-nav{display:flex}.nav-link{flex:1;justify-content:center}}

<body>
  <div class="prototype">Prototype · no files or deployments change</div>
  <div id="app"></div><div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
  <script>
    const state={filter:"needs",approved:false,generated:false,saved:false,profile:{name:"night-watch",base:"strict",steps:"1, 2, 3, all",checkpoint:45,interval:10,errorRate:3}};
    const changes=[
      {id:42,service:"payouts-api",title:"Remove retry ceiling",branch:"feat/adaptive-retries",updated:"4 min ago",tier:"risky",lane:"strict",category:"Availability",risk:"Retry protection was removed"},
      {id:38,service:"ledger-worker",title:"Increase settlement concurrency",branch:"perf/batch-workers",updated:"18 min ago",tier:"risky",lane:"strict",category:"Data",risk:"Parallel writes may duplicate settlements"},
      {id:31,service:"merchant-api",title:"Update upstream timeouts",branch:"chore/timeouts",updated:"36 min ago",tier:"guarded",lane:"guarded",category:"Availability",risk:"Timeout is shorter than the slowest dependency"},
      {id:19,service:"notification-service",title:"Upgrade queue client",branch:"deps/queue-client",updated:"1 hr ago",tier:"guarded",lane:"guarded",category:"Compatibility",risk:"Client upgrade changes acknowledgement behavior"}
    ];
    const resolved=[
      {id:15,service:"reporting-api",title:"Add export format",branch:"feat/csv-export",updated:"2 hrs ago",tier:"safe",lane:"fast",category:"Compatibility",risk:"No protected behavior changed"},
      {id:12,service:"identity-service",title:"Rename internal metric",branch:"chore/metric-name",updated:"Yesterday",tier:"safe",lane:"fast",category:"Availability",risk:"No runtime behavior changed"}
    ];
    const page=()=>["changes","assessment","profiles","create"].includes(new URLSearchParams(location.search).get("page"))?new URLSearchParams(location.search).get("page"):"changes";
    const mode=()=>new URLSearchParams(location.search).get("mode")==="manual"?"manual":"ai";
    const url=(name,extra="")=>`?page=${name}${extra}`;
    function shell(content,narrow=false){const here=page(),changesOn=["changes","assessment"].includes(here),profilesOn=["profiles","create"].includes(here),pending=changes.length-(state.approved?1:0);return `<div class="shell"><aside class="sidebar"><a class="brand" href="${url("changes")}"><span class="brand-mark">SL</span>SafeLane Studio</a><div class="nav-label">Workspace</div><nav class="main-nav"><a class="nav-link ${changesOn?"active":""}" href="${url("changes")}"><span class="nav-icon">◇</span>Changes<span class="count">${pending}</span></a><a class="nav-link ${profilesOn?"active":""}" href="${url("profiles")}"><span class="nav-icon">▤</span>Profiles</a></nav><div class="repo-card"><span>Connected repository</span><strong>safelane-demo</strong><small>GitHub · local workspace</small></div></aside><div class="workspace"><header class="topbar"><div class="project">safelane-demo <span class="env">local</span>⌄</div><div class="ai-status"><span class="online"></span>Ollama local · qwen2.5-coder:7b</div></header><main class="content ${narrow?"narrow":""}">${content}</main></div></div>`}
    const tier=t=>`<span class="tag ${t}">● ${t}</span>`;
    const lane=l=>`<span class="lane ${l}">${l} lane</span>`;
    function row(c){return `<button class="change-row" data-change="${c.id}"><span class="change-copy"><span class="title-line"><span class="change-title">${c.service} · PR #${c.id}</span><span class="row-risk ${c.tier}">${c.tier}</span></span><span class="change-meta">${c.title} · <code>${c.branch}</code> · ${c.updated}</span><span class="risk-line"><span class="category">${c.category}</span><strong>${c.risk}</strong></span></span><span class="suggestion ${c.lane}"><span>Suggested lane</span><strong>${c.lane[0].toUpperCase()+c.lane.slice(1)}</strong></span><span class="arrow">›</span></button>`}
    function changesPage(){const pending=state.approved?changes.filter(c=>c.id!==42):changes,done=state.approved?[{...changes[0],updated:"Approved just now"},...resolved]:resolved,list=state.filter==="needs"?pending:done,note=state.filter==="needs"?"Risky first · newest first":"Latest first";return shell(`<header class="page-head"><div><div class="eyebrow">Change review</div><h1>${state.filter==="needs"?"Changes needing review":"Resolved changes"}</h1><p>${state.filter==="needs"?"Risky and guarded pull requests wait here until their rollout is approved.":"Safe changes resolve automatically. Approved guarded and risky changes appear here too."}</p></div><span class="version">POLICY 2026.08.2</span></header><div class="tabs"><button class="tab ${state.filter==="needs"?"active":""}" data-filter="needs">Needs review · ${pending.length}</button><button class="tab ${state.filter==="resolved"?"active":""}" data-filter="resolved">Resolved · ${done.length}</button></div><div class="list-head"><span>${list.length} changes</span><span>${note}</span></div><div class="change-list">${list.map(row).join("")}</div>`)}
    function rail(){return `<div class="rail-wrap"><div class="pod"><div class="pod-circle">1</div><small>20%</small></div><div class="rail"></div><div class="pod"><div class="pod-circle">2</div><small>40%</small></div><div class="rail"></div><div class="pod"><div class="pod-circle">3</div><small>60%</small></div><div class="rail"></div><div class="pod"><div class="pod-circle">all</div><small>100%</small></div></div>`}
    function assessmentPage(){return shell(`<nav class="breadcrumb"><a href="${url("changes")}">Changes</a><span>›</span><span>payouts-api · PR #42</span></nav><header class="assessment-head"><div><div class="eyebrow">Assessment 3 · latest push</div><h1>Remove retry ceiling</h1><p>payouts-api · feat/adaptive-retries · updated 4 minutes ago</p></div><div class="assessment-tags">${tier("risky")}</div></header><div class="update">✓ This assessment covers the latest push. Any new push will require a fresh review.</div><section class="card decision"><div class="decision-value"><span>Suggested rollout</span><strong>Strict</strong></div><div><h2>Review required before this PR can be resolved</h2><p>SafeLane recommends the Strict lane because this change can repeat a known production failure.</p></div></section><section class="card main-risk"><div class="risk-top"><span class="category">Availability</span><span class="verified">✓ AI finding · evidence verified</span></div><h2>Retry protection was removed</h2><p>Without a retry limit, workers may exhaust the connection pool during an upstream failure. The same behavior caused incident INC-003.</p><span class="source">config/retries.yaml:18 · retry_limit: 5 → null</span></section><section class="card rollout"><div class="card-head"><div><h2>Strict rollout</h2><p class="copy">Pod counts come from the service's 5 configured replicas.</p></div><span class="version">5 replicas</span></div>${rail()}<div class="health"><div><span>Checkpoint</span><strong>30 seconds</strong></div><div><span>Read every</span><strong>10 seconds</strong></div><div><span>Error limit</span><strong>5%</strong></div><div><span>Rollback</span><strong>2 bad readings</strong></div></div></section><details class="card evidence"><summary>See 3 supporting reasons</summary><div class="evidence-list"><div class="evidence-item"><strong>Changed behavior</strong><code>config/retries.yaml:18 · retry_limit: 5 → null</code></div><div class="evidence-item"><strong>Incident connection</strong><code>INC-003 · “workers retried without a limit and exhausted the connection pool”</code></div><div class="evidence-item"><strong>Service impact</strong><p>Three downstream services depend on payouts-api.</p></div></div></details><section class="card approval">${state.approved?`<div class="approved">✓ Strict rollout approved</div><div class="buttons"><a class="button" href="${url("changes")}">Return to Changes</a></div>`:`<div><h2>Approve this rollout plan?</h2><p>This records the decision and resolves the PR. It does not deploy anything.</p></div><div class="buttons"><button class="button" id="safer">Choose a safer profile</button><button class="button primary" id="approve">Approve Strict rollout</button></div>`}</section>`,true)}
    function profile(name,desc,route,color,soft,icon){return `<article class="profile-card" style="--profile:${color};--soft:${soft}"><span class="profile-icon">${icon}</span><h2>${name}</h2><p>${desc}</p><code>${route}</code></article>`}
    function profilesPage(){const added=state.saved?`<div class="custom-row"><div><div class="custom-name">night-watch</div><div class="custom-meta">1 → 2 → 3 → all · 45s · 3% errors</div></div><span class="custom-source">Generated with AI</span>${lane("strict")}</div>`:"";return shell(`<header class="page-head"><div><div class="eyebrow">Rollout policy</div><h1>Profiles</h1><p>Built-in profiles set the minimum rollout behavior. Custom profiles may only be equally careful or safer.</p></div><span class="version">POLICY 2026.08.2</span></header><section class="profiles">${profile("Fast","For safe changes. Kubernetes readiness is the only gate.","all pods · readiness","#08784a","#e9f8f0","F")}${profile("Guarded","For changes that need one checkpoint before full rollout.","2 pods → check → all","#a15c07","#fff4e2","G")}${profile("Strict","For risky changes. Exposure grows after each health checkpoint.","1 → 2 → 3 → all","#b42318","#feeeec","S")}</section><div class="custom-head"><div><h2>Custom profiles</h2><p class="copy">Every custom profile starts from a built-in safety level.</p></div><div class="profile-actions"><a class="button link" href="${url("create","&mode=manual")}">Start manually</a><a class="button purple" href="${url("create","&mode=ai")}">Generate profile with AI</a></div></div><div class="custom-list">${added}<div class="custom-row"><div><div class="custom-name">weekend-safe</div><div class="custom-meta">1 → 2 → all · 60s · 2% errors</div></div><span class="custom-source">Created manually</span>${lane("strict")}</div></div>`)}
    function yaml(){const p=state.profile,hasCheckpoint=String(p.steps).split(",").map(x=>x.trim()).at(0)!=="all",checkpoint=hasCheckpoint?`\n    checkpoint:\n      seconds: ${p.checkpoint}\n      interval_seconds: ${p.interval}\n      measurement_count: ${Math.floor(Number(p.checkpoint)/Number(p.interval))}\n      max_error_rate: ${(Number(p.errorRate)/100).toFixed(2)}\n      failure_limit: 1\n      consecutive_error_limit: 2`:`\n    checkpoint: null`;return `profiles:\n  ${p.name}:\n    base: ${p.base}\n    source: ${mode()==="ai"?"ai_assisted":"custom"}\n    description: A reviewed custom rollout profile.\n    steps: [${p.steps}]${checkpoint}`}
    function fields(){const p=state.profile;return `<div class="field"><label for="name">Profile name</label><input id="name" data-field="name" value="${p.name}"></div><div class="field"><label for="base">Base profile</label><select id="base" data-field="base"><option value="strict">Strict</option><option value="guarded">Guarded</option><option value="fast">Fast</option></select></div><div class="field wide"><label for="steps">Pod steps</label><input id="steps" data-field="steps" value="${p.steps}"></div><div class="field"><label for="checkpoint">Checkpoint seconds</label><input id="checkpoint" type="number" data-field="checkpoint" value="${p.checkpoint}"></div><div class="field"><label for="interval">Reading interval</label><input id="interval" type="number" data-field="interval" value="${p.interval}"></div><div class="field wide"><label for="error">Maximum error rate (%)</label><input id="error" type="number" step=".5" data-field="errorRate" value="${p.errorRate}"></div>`}
    function createPage(){const manual=mode()==="manual",show=manual||state.generated;return shell(`<nav class="breadcrumb"><a href="${url("profiles")}">Profiles</a><span>›</span><span>${manual?"Create manually":"Generate with AI"}</span></nav><header class="page-head"><div><div class="eyebrow">New custom profile</div><h1>${manual?"Create profile manually":"Generate profile with AI"}</h1><p>${manual?"Start from a built-in profile and make it equally careful or safer.":"Describe the rollout. Ollama creates one local draft, then SafeLane's fixed rules validate it."}</p></div></header><section class="card create">${manual?"":`<div class="prompt"><label for="prompt">What should this rollout do differently?</label><textarea id="prompt" placeholder="Watch every stage for 45 seconds and use a 3% error limit. Keep the one-pod start."></textarea><div class="prompt-foot"><small>Ollama sees only your request, local profiles, service settings, examples, and fixed safety rules.</small><button class="button purple" id="generate">Generate one draft</button></div></div>`}${show?`<hr><div class="draft-head"><h2>${manual?"Profile settings":"AI draft"}</h2><span class="valid">✓ Valid against Strict</span></div><div class="form">${fields()}</div><details class="yaml"><summary>Preview YAML</summary><pre id="yaml">${yaml()}</pre></details><div class="create-actions"><small>Nothing changes until you approve this profile.</small><button class="button primary" id="save">Validate + approve profile</button></div>`:`<div class="empty"><strong>No draft yet</strong>Describe the rollout above, then generate one local draft.</div>`}</section>`,true)}
    function validate(){const p=state.profile,s=String(p.steps).split(",").map(x=>x.trim()),n=s.slice(0,-1).map(Number),base={fast:[],guarded:[2],strict:[1,2,3]}[p.base];if(!String(p.name).trim())return"Profile name is required.";if(s.at(-1)!=="all")return"The final step must be ‘all’.";if(n.some(x=>!Number.isInteger(x)||x<1||x>=5))return"Pod steps must be whole numbers between 1 and 4.";if(n.some((x,i)=>i&&x<=n[i-1]))return"Pod steps must increase.";if(n.length<base.length||base.some((x,i)=>n[i]>x))return`This profile must be at least as careful as ${p.base}.`;if(n.length&&(!Number.isInteger(+p.checkpoint)||+p.checkpoint<1||!Number.isInteger(+p.interval)||+p.interval<1||+p.checkpoint<+p.interval))return"Checkpoint and interval must produce at least one reading.";if(base.length&&(+p.checkpoint<30||+p.interval>10))return"Guarded and Strict descendants must keep at least the built-in observation.";if(+p.errorRate<=0||+p.errorRate>5)return"The service limit is 5%; a profile cannot be weaker.";return""}
    function toast(message,type=""){const el=document.getElementById("toast");el.textContent=message;el.className=`toast ${type}`.trim();clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.add("hidden"),3600)}
    function render(){document.getElementById("app").innerHTML=page()==="assessment"?assessmentPage():page()==="profiles"?profilesPage():page()==="create"?createPage():changesPage();bind()}
    function go(target){history.pushState({},"",target);render();window.scrollTo(0,0)}
    function bind(){document.querySelectorAll("[data-filter]").forEach(b=>b.onclick=()=>{state.filter=b.dataset.filter;render()});document.querySelectorAll("[data-change]").forEach(b=>b.onclick=()=>go(url("assessment")));document.getElementById("approve")?.addEventListener("click",()=>{state.approved=true;render();toast("Strict rollout approved. The PR moved to Resolved. Nothing was deployed.")});document.getElementById("safer")?.addEventListener("click",()=>{go(url("profiles"));toast("Choose Strict or a custom profile that is even safer.")});document.getElementById("generate")?.addEventListener("click",e=>{const prompt=document.getElementById("prompt").value.trim();if(!prompt)return toast("Describe the rollout first.","error");e.currentTarget.textContent="Generating locally…";e.currentTarget.disabled=true;setTimeout(()=>{state.generated=true;render();toast("Ollama created one draft. SafeLane's fixed rules validated it.")},650)});document.querySelectorAll("[data-field]").forEach(i=>i.oninput=e=>{state.profile[e.target.dataset.field]=e.target.value;const y=document.getElementById("yaml");if(y)y.textContent=yaml()});document.getElementById("save")?.addEventListener("click",()=>{const error=validate();if(error)return toast(error,"error");state.saved=true;go(url("profiles"));toast("Profile approved in prototype memory. No file was changed.")})}
    addEventListener("popstate",render);document.addEventListener("click",e=>{const a=e.target.closest("a[href^='?page=']");if(!a)return;e.preventDefault();go(a.getAttribute("href"))});render();
  </script>
</body>
